name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests and proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run proof

  glasses:
    name: Glasses tests, build and dev panel proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The dev panel proof starts the server, which has one package of its own.
      - run: npm ci
      - run: npm ci
        working-directory: glasses
      - run: npm test
        working-directory: glasses
      - run: npm run build
        working-directory: glasses
      # The real glasses app against a local server, with fake device input and a fake Telegram.
      - run: node devpanel/proof.js
